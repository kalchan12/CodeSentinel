[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codesentinel"
version = "0.1.0"
description = "Local-first secure source code analysis & risk assessment platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.1,<4.0",
    "alembic>=1.13,<2.0",
    "celery>=5.4,<6.0",
    "redis>=5.0,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends-in-default is the idiomatic injection style.
"apps/backend/app/api/routes/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "apps/backend"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "integration: requires PostgreSQL and Redis (e.g. docker compose up)",
]