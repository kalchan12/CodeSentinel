rules:
  - id: py-subprocess-shell-true
    languages: [python]
    severity: WARNING
    message: Using shell=True in subprocess calls risks shell injection when
      arguments contain untrusted input. Pass a list of arguments instead.
    metadata:
      category: security
      cwe: ["CWE-78"]
    patterns:
      - pattern-either:
          - pattern: subprocess.call(..., shell=True)
          - pattern: subprocess.run(..., shell=True)
          - pattern: subprocess.Popen(..., shell=True)
          - pattern: subprocess.check_output(..., shell=True)
          - pattern: subprocess.check_call(..., shell=True)
          - pattern: os.system(...)
          - pattern: os.popen(...)
    fix: Replace shell=True with an argument list, e.g. subprocess.run(["ls", "-la"]).