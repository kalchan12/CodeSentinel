name: codesentinel-dev

# Local-first development environment for CodeSentinel.
# The desktop app itself runs on the host (`npm run dev:desktop`);
# containers provide PostgreSQL, Redis, the API and the Celery worker.
#
# All services share one Python image built from the repo root.
# The `backend` and `worker` services mount the source directories so
# code changes are picked up without rebuilding the image.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codesentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codesentinel}
      POSTGRES_DB: ${POSTGRES_DB:-codesentinel}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codesentinel} -d ${POSTGRES_DB:-codesentinel}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --reload-dir /app/apps/backend --reload-dir /app/engine
    environment:
      CODESENTINEL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-codesentinel}:${POSTGRES_PASSWORD:-codesentinel}@postgres:5432/${POSTGRES_DB:-codesentinel}
      CODESENTINEL_REDIS_URL: redis://redis:6379/0
      CODESENTINEL_DATA_DIR: /data
      CODESENTINEL_CORS_ORIGINS: ${CODESENTINEL_CORS_ORIGINS:-http://localhost:3000,http://localhost:1420,tauri://localhost}
      CODESENTINEL_ENABLED_ANALYZERS: ${CODESENTINEL_ENABLED_ANALYZERS:-mock}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./engine:/app/engine
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: worker
    environment:
      CODESENTINEL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-codesentinel}:${POSTGRES_PASSWORD:-codesentinel}@postgres:5432/${POSTGRES_DB:-codesentinel}
      CODESENTINEL_REDIS_URL: redis://redis:6379/0
      CODESENTINEL_DATA_DIR: /data
      CODESENTINEL_ENABLED_ANALYZERS: ${CODESENTINEL_ENABLED_ANALYZERS:-mock}
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./engine:/app/engine
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata: